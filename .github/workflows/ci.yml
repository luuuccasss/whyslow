name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Smoke test
        run: |
          cargo build --release
          ./target/release/whyslow --json=run.json --html=run.html sh -c 'sleep 0.3; echo hello; ls / > /dev/null'
          ./target/release/whyslow show run.json --no-report --trace=run.trace.json
          ./target/release/whyslow compare run.json run.json
          test -s run.html && test -s run.trace.json
